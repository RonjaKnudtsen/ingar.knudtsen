<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingar Knudtsen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="homepage">
    <div class="home-container">
        <header class="hero">
            <h1 class="hero-title">Ingar Knudtsen</h1>
            <p class="hero-subtitle">Forfatter · 1944-2025</p>
        </header>

        <section class="books-section">
            <h2 class="section-title">Utvalgte verk</h2>
            <div class="books-grid">
                <div class="book-card">
                    <img src="/images/boker/lovinnens.gif" alt="Løvinnens sjel">
                    <h3>Løvinnens sjel</h3>
                    <p class="book-year">1999</p>
                </div>
                <div class="book-card">
                    <img src="/images/boker/vapensostrene.gif" alt="Våpensøstrene">
                    <h3>Våpensøstrene</h3>
                    <p class="book-year">1998</p>
                </div>
                <div class="book-card">
                    <img src="/images/boker/rodmane.gif" alt="Rød måne">
                    <h3>Rød måne</h3>
                    <p class="book-year">2001</p>
                </div>
                <div class="book-card">
                    <img src="/images/boker/havheksen.gif" alt="Havheksen">
                    <h3>Havheksen</h3>
                    <p class="book-year">1995</p>
                </div>
                <div class="book-card">
                    <img src="/images/boker/evigskogen.gif" alt="Evig skogen">
                    <h3>Evig skogen</h3>
                    <p class="book-year">1993</p>
                </div>
                <div class="book-card">
                    <img src="/images/boker/dimensjons-bok.jpg" alt="Dimensjonsportene">
                    <h3>Dimensjonsportene</h3>
                    <p class="book-year">1990</p>
                </div>
            </div>
        </section>

    </div>

    <script src="./dist/main.js"></script>
</body>
</html>
